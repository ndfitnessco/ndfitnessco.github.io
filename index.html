<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ND Fitness Co.</title>
<meta name="description" content="Train with Nico at ND Fitness Co., Redbourn. Workouts, progress and check-ins, saved on your phone.">
<meta name="theme-color" content="#8e6364">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ND Fitness">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<style>
@font-face{font-family:'Bebas';src:url(assets/bebas-neue.woff2) format('woff2');font-display:swap}
:root{
  --rose:#8e6364;--rose-d:#6f4a4b;--rose-dd:#4a3132;--rose-l:#c9a9a9;--rose-xl:#f1e6e5;
  --bg:#f6f1f0;--card:#fff;--ink:#2a2223;--mute:#7d7172;--line:#e8dedd;
  --navy:#22304a;--ok:#3f8f6b;--warn:#c8812e;--bad:#b9473f;
  --r:18px;--sh:0 1px 2px rgba(74,49,50,.06),0 6px 18px rgba(74,49,50,.07);
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;overscroll-behavior-y:none}
h1,h2,h3,.bebas{font-family:'Bebas',Impact,'Arial Narrow',sans-serif;font-weight:400;letter-spacing:.02em;margin:0;line-height:1}
h1{font-size:38px}h2{font-size:28px}h3{font-size:22px}
p{margin:.4em 0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
input,select,textarea{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
input:focus,select:focus,textarea:focus{border-color:var(--rose)}
textarea{min-height:84px;resize:vertical}
label.f{display:block;margin:14px 0 6px;font-weight:600;font-size:14px}
.hint{font-size:13px;color:var(--mute)}
.app{max-width:540px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:calc(86px + var(--safe-b))}
.wrap{padding:0 16px}
/* header */
.hero{background:var(--rose);color:#fff;padding:calc(18px + var(--safe-t)) 18px 22px;border-radius:0 0 26px 26px;position:relative;overflow:hidden}
.hero .logo{height:30px;display:block}
.hero h1{margin-top:16px}
.hero .sub{opacity:.85;font-size:14px}
.hero .bell{position:absolute;right:-30px;bottom:-22px;width:170px;opacity:.09}
.pagehead{padding:calc(16px + var(--safe-t)) 18px 8px;display:flex;align-items:end;justify-content:space-between}
.pagehead h1{color:var(--rose-dd)}
/* cards */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin:14px 0}
.card.rose{background:var(--rose);color:#fff}
.card.dark{background:var(--rose-dd);color:#fff}
.card h3{color:var(--rose-dd)}
.card.rose h3,.card.dark h3{color:#fff}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--rose)}
.card.rose .eyebrow,.card.dark .eyebrow{color:#f3d9d8}
.muted{color:var(--mute)}
.small{font-size:13px}
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 18px;border-radius:14px;background:var(--rose);color:#fff;font-weight:700;font-size:16px;width:100%;transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn.light{background:var(--rose-xl);color:var(--rose-dd)}
.btn.white{background:#fff;color:var(--rose-dd)}
.btn.ghost{background:transparent;color:var(--rose-d);border:1.5px solid var(--rose-l)}
.btn.wa{background:#25d366;color:#fff}
.btn.danger{background:#fbe9e7;color:var(--bad)}
.btn.sm{padding:9px 14px;font-size:14px;width:auto;border-radius:11px}
.btns{display:grid;gap:10px;margin-top:14px}
.btns.two{grid-template-columns:1fr 1fr}
.pill{display:inline-block;padding:4px 10px;border-radius:99px;background:var(--rose-xl);color:var(--rose-dd);font-size:12px;font-weight:700}
.pill.ok{background:#e3f2ea;color:var(--ok)}.pill.warn{background:#fbeedd;color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 14px;border-radius:99px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:14px}
.chip.on{background:var(--rose);border-color:var(--rose);color:#fff}
.list .li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.list .li:last-child{border-bottom:0}
.ico{width:42px;height:42px;border-radius:12px;background:var(--rose-xl);color:var(--rose-d);display:grid;place-items:center;flex:none;font-size:20px}
.ico svg{width:22px;height:22px}
.chev{color:var(--rose-l);font-size:22px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:#fff;border-radius:14px;padding:12px;box-shadow:var(--sh);text-align:center}
.stat b{display:block;font-family:'Bebas',Impact,sans-serif;font-size:30px;font-weight:400;color:var(--rose-d);line-height:1.05}
.stat span{font-size:12px;color:var(--mute)}
/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.wd{text-align:center;font-size:12px;opacity:.85}
.wd i{display:grid;place-items:center;margin:5px auto 0;width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.4);font-style:normal;font-weight:700}
.wd.done i{background:#fff;color:var(--rose-d);border-color:#fff}
.wd.today i{border-color:#fff;border-style:solid;box-shadow:0 0 0 3px rgba(255,255,255,.25)}
/* habits */
.glasses{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.glass{width:30px;height:36px;border-radius:5px 5px 9px 9px;border:2px solid var(--rose-l);position:relative;overflow:hidden}
.glass.on{background:linear-gradient(#9ac7e8,#5ba3d6);border-color:#5ba3d6}
.moods{display:flex;justify-content:space-between;margin-top:8px}
.mood{font-size:28px;filter:grayscale(1);opacity:.45;padding:4px}
.mood.on{filter:none;opacity:1;transform:scale(1.15)}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.mini input{padding:10px 12px}
/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 6px calc(6px + var(--safe-b))}
.tabs .in{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:600;color:#a39798}
.tab svg{width:25px;height:25px}
.tab.on{color:var(--rose)}
/* sheets */
.scrim{position:fixed;inset:0;background:rgba(42,34,35,.45);z-index:50;opacity:0;transition:opacity .2s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:540px;margin:0 auto;background:var(--bg);border-radius:24px 24px 0 0;max-height:92vh;overflow:auto;padding:8px 16px calc(24px + var(--safe-b));transform:translateY(100%);transition:transform .25s ease}
.sheet.show{transform:none}
.grab{width:42px;height:5px;border-radius:9px;background:#d8cccb;margin:4px auto 12px}
.sheet .x{position:absolute;right:12px;top:10px;width:34px;height:34px;border-radius:50%;background:#fff;font-size:20px;color:var(--mute)}
/* full screen */
.full{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto}
.full .inner{max-width:540px;margin:0 auto;padding:calc(14px + var(--safe-t)) 16px calc(120px + var(--safe-b))}
/* onboarding */
.ob{min-height:100vh;background:var(--rose);color:#fff}
.ob .inner{max-width:540px;margin:0 auto;padding:calc(20px + var(--safe-t)) 20px calc(30px + var(--safe-b));min-height:100vh;display:flex;flex-direction:column}
.ob .panel{background:var(--bg);color:var(--ink);border-radius:22px;padding:18px;margin-top:16px}
.ob .dots{display:flex;gap:6px;margin-top:14px}
.ob .dots i{height:5px;flex:1;border-radius:9px;background:rgba(255,255,255,.3)}
.ob .dots i.on{background:#fff}
.yn{display:grid;grid-template-columns:1fr 64px 64px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.yn button{padding:9px 0;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:14px}
.yn button.on.y{background:var(--warn);border-color:var(--warn);color:#fff}
.yn button.on.n{background:var(--ok);border-color:var(--ok);color:#fff}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin-top:14px}
.check input{width:22px;height:22px;flex:none;margin-top:1px;-webkit-appearance:checkbox;appearance:auto;accent-color:var(--rose)}
/* workout player */
.ptop{position:sticky;top:0;z-index:5;background:rgba(246,241,240,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);margin:0 -16px;padding:calc(10px + var(--safe-t)) 16px 10px;border-bottom:1px solid var(--line)}
.excard{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin:14px 0}
.excard h3{color:var(--rose-dd);font-size:23px}
.sethead,.setrow{display:grid;grid-template-columns:30px 1fr 70px 70px 44px;gap:8px;align-items:center}
.setrow.bw,.sethead.bw{grid-template-columns:30px 1fr 90px 44px}
.sethead{font-size:11px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin-top:10px}
.setrow{padding:5px 0;border-radius:10px}
.setrow input{padding:9px 6px;text-align:center;font-weight:700;border-radius:10px;background:var(--bg);border-color:transparent}
.setrow .sn{font-weight:800;color:var(--rose);text-align:center}
.setrow .prev{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tick{width:40px;height:38px;border-radius:10px;background:var(--bg);color:#b8abab;font-size:20px;font-weight:900}
.setrow.done{background:#e6f3ec}
.setrow.done input{background:transparent}
.setrow.done .tick{background:var(--ok);color:#fff}
.rest{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--rose-dd);color:#fff;padding:12px 16px calc(12px + var(--safe-b));transform:translateY(110%);transition:transform .25s}
.rest.show{transform:none}
.rest .in{max-width:540px;margin:0 auto;display:flex;align-items:center;gap:10px}
.rest .t{font-family:'Bebas',Impact,sans-serif;font-size:40px;line-height:1;min-width:84px}
.rest .bar{height:4px;border-radius:9px;background:rgba(255,255,255,.2);margin-top:6px;overflow:hidden}
.rest .bar i{display:block;height:100%;background:#fff;width:100%}
.rest button{background:rgba(255,255,255,.14);color:#fff;border-radius:10px;padding:9px 12px;font-weight:700}
/* charts & misc */
.chart{width:100%;height:auto;display:block}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photo{aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--rose-xl);position:relative}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo span{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.5);color:#fff;font-size:11px;padding:2px 7px;border-radius:99px}
.addphoto{display:grid;place-items:center;color:var(--rose);font-size:34px;border:2px dashed var(--rose-l);background:transparent}
.quote{font-size:15px;font-style:italic}
.quote b{display:block;font-style:normal;margin-top:8px;color:var(--navy)}
.search{position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:2}
.toast{position:fixed;left:50%;top:calc(14px + var(--safe-t));transform:translate(-50%,-150%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:99px;font-weight:600;font-size:14px;z-index:99;transition:transform .25s;max-width:90vw;text-align:center}
.toast.show{transform:translate(-50%,0)}
.banner{background:var(--navy);color:#fff;border-radius:14px;padding:12px 14px;margin:14px 0;display:flex;gap:10px;align-items:center;font-size:14px}
.banner b{display:block}
.steps{counter-reset:s;padding:0;margin:14px 0;list-style:none}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:center;padding:10px 0;font-size:16px}
.steps li:before{content:counter(s);width:32px;height:32px;border-radius:50%;background:#fff;color:var(--rose-d);font-weight:800;display:grid;place-items:center;flex:none}
.cue{padding-left:20px;margin:8px 0}
.cue li{margin:5px 0}
.prbadge{display:inline-block;background:#fff3d6;color:#8a5a00;font-weight:800;font-size:12px;padding:3px 8px;border-radius:8px}
.celebrate{text-align:center;padding:30px 10px}
.celebrate .big{font-size:64px}
.progbar{height:8px;border-radius:9px;background:rgba(255,255,255,.25);overflow:hidden;margin-top:10px}
.progbar i{display:block;height:100%;background:#fff;border-radius:9px}
.card:not(.rose):not(.dark) .progbar{background:var(--rose-xl)}
.card:not(.rose):not(.dark) .progbar i{background:var(--rose)}
.hide{display:none!important}
/* landing page */
.land{max-width:540px;margin:0 auto}
.lhero{background:var(--rose);color:#fff;text-align:center;padding:calc(40px + var(--safe-t)) 24px 70px;border-radius:0 0 34px 34px;position:relative;overflow:hidden}
.lhero .bell{position:absolute;left:-50px;top:30px;width:220px;opacity:.07;transform:rotate(-18deg)}
.lhero .appicon{width:112px;height:112px;border-radius:26px;box-shadow:0 12px 30px rgba(40,20,20,.35),0 0 0 1px rgba(255,255,255,.25);display:block;margin:0 auto}
.lhero h1{font-size:46px;margin-top:14px}
.lhero p{opacity:.9;max-width:32ch;margin:10px auto 0}
.osbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.osbtn{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px 10px;border-radius:16px;background:var(--ink);color:#fff;text-align:left;border:2px solid var(--ink);transition:transform .1s}
.osbtn span{font-weight:800;font-size:19px;line-height:1.1}
.osbtn small{display:block;font-weight:500;font-size:11px;opacity:.75}
.osbtn.on{background:var(--rose);border-color:var(--rose)}
.osbtn:active{transform:scale(.97)}
.stepsbox .steps li{font-size:15px;align-items:flex-start}
.stepsbox .steps li:before{background:var(--rose);color:#fff}
.stepsbox .banner{margin-bottom:0}
</style>
</head>

<script>
'use strict';
/* =========================================================
   ND Fitness Co. client app
   Everything is saved on the client's own phone (localStorage
   + IndexedDB for photos). Nothing is sent anywhere unless the
   client taps a WhatsApp / email / share button themselves.
   ========================================================= */

const NICO = {
  name: 'Nico', biz: 'ND Fitness Co.',
  phone: '07485074661', wa: '447485074661',
  email: 'Contact@NdfitnessCo.com', ig: 'ndfitnessco',

  about: "I'm a dedicated personal trainer focused on helping people feel stronger, move better, and build lasting confidence in their bodies. I specialise in weight loss, muscle building, and lower back pain or injury management. Whether your goal is to drop body fat, gain lean muscle, or finally train without discomfort, I create tailored programmes that match your ability. For those dealing with lower back issues, I prioritise safe movement patterns, core strength, and mobility to help reduce pain and prevent future injury, without sacrificing progress in other areas of fitness.",
  quals: ['Level 2 & 3 Personal Training','Level 2 & 3 Fitness Instructor','Level 2 Diploma in Active Leisure','Level 2 NVQ in Activity Leadership','Core Trainer','Kettlebell Trainer','Level 2 Circuit Trainer','Level 2 & 3 Lower Back Pain Specialist','Level 2 Exercise for Fat Loss','Level 2 Boxing Personal Trainer','Parkinson\'s trained','Autism, Sport & Physical Activity Coach'],
  classes: [{d:1,t:'08:30'},{d:2,t:'11:45'},{d:3,t:'19:30'},{d:5,t:'12:30'}],
  reviews: [
    ['Before starting PT sessions with Nico I was struggling to lose weight and was stuck, not knowing what to do next. Nico is motivational and encouraging, but also realistic, adapting sessions to my energy levels each time. Now I\'ve lost weight, become more confident and I\'m so much stronger.','Vicky'],
    ['For me, gyms had always been scary places and exercise was never something I thought I could do or enjoy. Working with Nico has been an absolute game changer. I now look forward to the gym, something I never thought I\'d say!','Emma'],
    ['Having always been intimidated by the gym and the machines, having a taster session with Nico and going on to have PT sessions with him has boosted my confidence. My body is much stronger and I\'m feeling so much better for it. Highly recommend NDFitnessCo.','Elaine']
  ]
};

/* ---------- exercise library ----------
   [id, name, group, equipment, type(w=weight+reps, b=reps, t=seconds), back(1 friendly, 2 take care), cues] */
const EX_RAW = [
['goblet-squat','Goblet Squat','Legs','Dumbbell','w',1,'Hold the dumbbell close to your chest|Sit down between your heels, chest tall|Push the floor away to stand'],
['bw-squat','Bodyweight Squat','Legs','Bodyweight','b',1,'Feet shoulder-width, toes slightly out|Sit back and down, knees over toes|Stand tall and squeeze your glutes'],
['back-squat','Barbell Back Squat','Legs','Barbell','w',2,'Bar on your upper back, brace your core|Sit down to at least parallel|Keep your chest up as you drive up'],
['leg-press','Leg Press','Legs','Machine','w',1,'Feet hip-width in the middle of the plate|Lower until knees are about 90°|Press through your heels, don\'t lock out'],
['reverse-lunge','Reverse Lunge','Legs','Dumbbell','w',1,'Step back and lower the back knee|Front shin stays fairly upright|Push through the front heel to return'],
['split-squat','Bulgarian Split Squat','Legs','Dumbbell','w',1,'Back foot on a bench|Drop straight down, torso tall|Drive through the front foot'],
['step-up','Step-Up','Legs','Dumbbell','w',1,'Whole foot on the box|Drive up through the top leg only|Control the way down'],
['leg-ext','Leg Extension','Legs','Machine','w',1,'Pad just above your ankles|Straighten fully and squeeze|Lower slowly for 2 seconds'],
['leg-curl','Seated Leg Curl','Legs','Machine','w',1,'Knees lined up with the pivot|Curl the pad down and under|Control it back up'],
['calf-raise','Standing Calf Raise','Legs','Machine','w',1,'Balls of feet on the edge|Rise as high as you can|Pause, then lower for a deep stretch'],
['rdl','Romanian Deadlift','Glutes & Hamstrings','Dumbbell','w',2,'Soft knees, push your hips back|Weights slide down your thighs, back flat|Stand by squeezing your glutes'],
['hip-thrust','Hip Thrust','Glutes & Hamstrings','Barbell','w',1,'Upper back on the bench, bar on hips|Drive hips up until body is flat|Chin tucked, ribs down, squeeze'],
['glute-bridge','Glute Bridge','Glutes & Hamstrings','Bodyweight','b',1,'Lie on your back, feet flat|Press through heels, lift hips|Squeeze glutes at the top for 1 second'],
['kb-swing','Kettlebell Swing','Glutes & Hamstrings','Kettlebell','w',2,'Hinge at the hips, not a squat|Snap your hips forward to float the bell|Arms are just ropes, brace at the top'],
['db-bench','Dumbbell Bench Press','Chest','Dumbbell','w',1,'Shoulder blades back and down|Lower to the sides of your chest|Press up and slightly in'],
['incline-db','Incline Dumbbell Press','Chest','Dumbbell','w',1,'Bench at about 30°|Elbows at roughly 45° from your body|Press up over your upper chest'],
['chest-press','Machine Chest Press','Chest','Machine','w',1,'Handles level with mid-chest|Press out without locking elbows|Slow 2-second return'],
['pushup','Push-Up','Chest','Bodyweight','b',1,'Hands under shoulders, body in one line|Lower chest to just above the floor|Knees down is fine: keep the line'],
['ohp-db','Seated Dumbbell Shoulder Press','Shoulders','Dumbbell','w',1,'Back against the bench|Press up without arching|Lower to ear height'],
['lat-raise','Lateral Raise','Shoulders','Dumbbell','w',1,'Slight bend in the elbows|Raise out to shoulder height|Lead with the elbows, lower slowly'],
['face-pull','Cable Face Pull','Shoulders','Cable','w',1,'Rope at face height|Pull towards your eyes, elbows high|Squeeze shoulder blades together'],
['lat-pulldown','Lat Pulldown','Back','Cable','w',1,'Hands just wider than shoulders|Pull the bar to your upper chest|Elbows down to your back pockets'],
['seated-row','Seated Cable Row','Back','Cable','w',1,'Sit tall, slight knee bend|Pull the handle to your belly button|Squeeze shoulder blades, then reach'],
['db-row','Single-Arm Dumbbell Row','Back','Dumbbell','w',1,'Hand and knee on the bench, flat back|Row the dumbbell to your hip|Lower all the way for a stretch'],
['inverted-row','Inverted / TRX Row','Back','Bodyweight','b',1,'Body straight like a plank|Pull your chest to the handles|Walk feet back to make it easier'],
['assisted-pullup','Assisted Pull-Up','Back','Machine','w',1,'More assistance weight = easier|Pull chin over the bar|Lower all the way under control'],
['bicep-curl','Dumbbell Biceps Curl','Arms','Dumbbell','w',1,'Elbows pinned to your sides|Curl up and turn palms to the ceiling|Lower slowly'],
['hammer-curl','Hammer Curl','Arms','Dumbbell','w',1,'Palms face each other|Curl without swinging|Squeeze at the top'],

      const W = num(s.w) || 0, R = num(s.r) || 0;

function obCollect() {
  const d = ob.d, v = id => ($('#' + id)?.value || '').trim();
  if (ob.step === 1) { d.first = v('o_first'); d.last = v('o_last'); d.dob = v('o_dob'); d.phone = v('o_phone'); d.email = v('o_email');
    if (!d.first) { toast('Please add your first name'); return false; } }
  if (ob.step === 2) {
    d.weight = readBW('o_w'); d.goalWeight = readBW('o_gw');
    const cm = num(v('o_hcm')), ft = num(v('o_hft')), inch = num(v('o_hin'));
    d.heightCm = cm || (ft || inch ? Math.round(((ft || 0) * 12 + (inch || 0)) * 2.54) : null);
  }
  if (ob.step === 3 && !d.goals.length) { toast('Pick at least one goal'); return false; }
  if (ob.step === 4) { d.injuries = v('o_inj'); d.consent = $('#o_ok').checked;
    if (d.parq.some(x => x === null)) { toast('Please answer every question'); return false; }
    if (!d.consent) { toast('Please tick to confirm'); return false; } }
  return true;
}
function obFinish() {
  const d = ob.d;
  S.profile = {first:d.first, last:d.last, dob:d.dob, phone:d.phone, email:d.email, heightCm:d.heightCm, goalWeight:d.goalWeight,
    goals:d.goals, exp:d.exp, days:d.days, injuries:d.injuries, parq:d.parq, parqDate:Date.now(), joined:Date.now()};
  if (d.weight) S.weights.push({date: Date.now(), kg: d.weight});
  S.programme = {id: recommendProg(d.goals), start: Date.now(), next: 0};
  save(); tab = 'home'; render();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
}

/* ---------- charts ---------- */
function lineChart(pts, goal) {
  const W = 320, H = 150, P = 26;
  const ys = pts.map(p => p.y).concat(goal ? [goal] : []);
  let lo = Math.min(...ys), hi = Math.max(...ys); if (hi - lo < 2) { lo -= 1; hi += 1; }
  const x0 = pts[0].x, x1 = pts[pts.length - 1].x || x0 + 1;
  const X = x => P + (x - x0) / ((x1 - x0) || 1) * (W - P - 10), Y = y => 10 + (hi - y) / (hi - lo) * (H - 34);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + X(p.x).toFixed(1) + ' ' + Y(p.y).toFixed(1)).join(' ');
  const area = d + ` L${X(x1).toFixed(1)} ${H - 24} L${P} ${H - 24} Z`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Body weight chart">
    <defs><linearGradient id="g1" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#8e6364" stop-opacity=".28"/><stop offset="1" stop-color="#8e6364" stop-opacity="0"/></linearGradient></defs>
    ${goal ? `<line x1="${P}" x2="${W - 10}" y1="${Y(goal)}" y2="${Y(goal)}" stroke="#22304a" stroke-dasharray="4 4" stroke-width="1.2"/><text x="${W - 10}" y="${Y(goal) - 4}" text-anchor="end" font-size="10" fill="#22304a">Goal</text>` : ''}
    <path d="${area}" fill="url(#g1)"/><path d="${d}" fill="none" stroke="#8e6364" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map(p => `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="3" fill="#fff" stroke="#8e6364" stroke-width="2"/>`).join('')}
    <text x="${P}" y="${H - 8}" font-size="10" fill="#7d7172">${fmtDate(x0)}</text><text x="${W - 10}" y="${H - 8}" font-size="10" fill="#7d7172" text-anchor="end">${fmtDate(x1)}</text>
  </svg>`;
}
function barChart(vols) {
  const W = 320, H = 140, max = Math.max(1, ...vols.map(v => v.v)), bw = (W - 20) / vols.length;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weekly volume chart">${vols.map((v, i) => {
    const h = v.v / max * (H - 40), x = 10 + i * bw;
    return `<rect x="${x + 5}" y="${H - 22 - h}" width="${bw - 10}" height="${Math.max(h, v.n ? 3 : 1)}" rx="5" fill="${i === vols.length - 1 ? '#8e6364' : '#c9a9a9'}"/>
      ${v.v ? `<text x="${x + bw/2}" y="${H - 26 - h}" font-size="9" text-anchor="middle" fill="#4a3132">${v.v >= 1000 ? round1(v.v / 1000) + 't' : v.v}</text>` : ''}
      <text x="${x + bw/2}" y="${H - 7}" font-size="9" text-anchor="middle" fill="#7d7172">${v.label}</text>`; }).join('')}</svg>`;
}

async function loadPhotos() {

  list.sort((a, b) => b.date - a.date);

}
function shrinkImage(file, max = 1080) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const s = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', .82)); };
    img.onerror = rej; img.src = url;
  });
}
document.addEventListener('change', async e => {
  if (e.target.id === 'photoInput' && e.target.files[0]) {
    try { const data = await shrinkImage(e.target.files[0]); await IDB.put({id: uid(), date: Date.now(), data}); toast('Photo saved to this phone'); loadPhotos(); }
    catch (err) { toast('Couldn\'t save that photo'); }
    e.target.value = '';

});

/* rest timer */
let restEnd = 0, restLen = 0, actx;
function startRest(sec) { restLen = sec; restEnd = Date.now() + sec * 1000; $('#rest').classList.add('show'); clearInterval(restH); restH = setInterval(restTick, 250); restTick(); }
function restTick() {
  const left = Math.max(0, (restEnd - Date.now()) / 1000);
  $('#restT').textContent = fmtDur(Math.ceil(left)); $('#restBar').style.width = (left / restLen * 100) + '%';
  if (left <= 0) { stopRest(); beep(); if (navigator.vibrate) navigator.vibrate([200, 100, 200]); toast('Rest over. Next set!'); }

function beep() { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); [0, .18].forEach(t => { const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = 880; g.gain.setValueAtTime(.25, actx.currentTime + t); g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + t + .15); o.connect(g); g.connect(actx.destination); o.start(actx.currentTime + t); o.stop(actx.currentTime + t + .16); }); } catch (e) {} }

function buildRecord() {

  const ql = q.toLowerCase(), list = Object.values(EX).filter(e => (libGroup === 'All' || e.group === libGroup) && (!ql || e.name.toLowerCase().includes(ql) || e.equip.toLowerCase().includes(ql)));
  return list.map(e => `<div class="li" data-act="${libPick ? 'pickEx' : 'exInfo'}" data-v="${e.id}" style="cursor:pointer"><div class="ico">${e.back === 1 ? '🌿' : '🏋️'}</div><div class="grow"><b>${esc(e.name)}</b><div class="small muted">${esc(e.group)} · ${esc(e.equip)}</div></div><span class="chev">${libPick ? '+' : '›'}</span></div>`).join('') || '<p class="muted">Nothing found.</p>';
}
function openLibrary(pick) {
  libPick = !!pick; libGroup = 'All';
  openSheet(`<h2>${pick ? 'Add exercise' : 'Exercise library'}</h2>
    <div class="search"><input id="libq" type="search" placeholder="Search exercises" autocomplete="off"></div>

    {onOpen: el => el.querySelector('#libq').addEventListener('input', ev => $('#liblist').innerHTML = libraryHTML(ev.target.value))});
}

function collectCheckin() {
  const sc = k => { const on = document.querySelector(`[data-scale="${k}"] .chip.on`); return on ? +on.dataset.v : null; };
  const since = Date.now() - 7*DAY, wk = workoutsInRange(since, Infinity);
  const days = Array.from({length: 7}, (_, i) => S.habits[dkey(new Date(Date.now() - i*DAY))] || {});
  const avg = k => { const v = days.map(d => num(d[k])).filter(x => x != null && x > 0); return v.length ? round1(v.reduce((a, b) => a + b, 0) / v.length) : null; };
  const kg = readBW('ci_w');
  if (kg && Math.abs(kg - (latestWeight() || 0)) > 0.3) S.weights.push({date: Date.now(), kg});
  const ci = {date: Date.now(), kg, energy: sc('energy'), sleep: sc('sleep'), stress: sc('stress'), food: sc('food'), workouts: wk.length,
    water: avg('water'), steps: avg('steps'), sleepHrs: avg('sleep'), wins: $('#ci_wins').value.trim(), hard: $('#ci_hard').value.trim(), q: $('#ci_q').value.trim()};
  S.checkins.push(ci); save(); return ci;
}

    `Workouts this week: ${c.workouts} (aiming for ${S.profile.days})\n` +
    (c.steps ? `Avg steps: ${Math.round(c.steps).toLocaleString()}\n` : '') + (c.sleepHrs ? `Avg sleep: ${c.sleepHrs}h\n` : '') + (c.water ? `Avg water: ${c.water} glasses\n` : '') +
    `\nEnergy ${c.energy || '-'}/5 · Sleep ${c.sleep || '-'}/5 · Stress ${c.stress || '-'}/5 · Eating ${c.food || '-'}/5\n` +
    (c.wins ? `\nWins: ${c.wins}` : '') + (c.hard ? `\nStruggles: ${c.hard}` : '') + (c.q ? `\nQuestion: ${c.q}` : '');
}

/* ---------- backup / restore ---------- */
async function backup() {
  let photos = []; try { photos = await IDB.all(); } catch (e) {}
  S.lastBackup = Date.now(); save();
  const blob = new Blob([JSON.stringify({app: 'ndfitness', v: 1, exported: Date.now(), data: S, photos})], {type: 'application/json'});
  const name = `ND-Fitness-backup-${dkey()}.json`, file = new File([blob], name, {type: 'application/json'});
  if (navigator.canShare && navigator.canShare({files: [file]})) {
    try { await navigator.share({files: [file], title: 'ND Fitness backup'}); toast('Backup ready. Save it somewhere safe.'); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  toast('Backup downloaded');
}
function restorePick() {
  let inp = $('#restoreInput');
  if (!inp) { document.body.insertAdjacentHTML('beforeend', '<input type="file" id="restoreInput" accept="application/json,.json" class="hide">'); inp = $('#restoreInput'); }
  inp.click();
}
async function restoreFile(f) {
  try {
    const j = JSON.parse(await f.text());
    if (j.app !== 'ndfitness' || !j.data) throw 0;
    S = Object.assign(blank(), j.data); S.active = null; save();
    if (j.photos?.length) { await IDB.clear(); for (const p of j.photos) await IDB.put(p); }
    closeSheet(true); tab = 'home'; render(); toast(`Welcome back, ${firstName()}!`);
  } catch (e) { toast('That isn\'t an ND Fitness backup file'); }
  $('#restoreInput').value = '';
}

  closeSheet: () => closeSheet(),
  skipGate: () => { sessionStorage.setItem('ndf.skipGate', '1'); render(); },
  install: () => { if (!deferredPrompt) return; deferredPrompt.prompt(); deferredPrompt.userChoice.then(r => { if (r.outcome === 'accepted') installed = true; deferredPrompt = null; render(); }); },
  landOS: a => { landOS = a.dataset.v; render(); },
  installHelp: () => installHelp(),
  obNext: () => { if (ob.step === 0 || obCollect()) { ob.step++; render(); window.scrollTo(0, 0); } },
  obBack: () => { obCollect(); ob.step = Math.max(0, ob.step - 1); render(); window.scrollTo(0, 0); },

  obTellNico: () => openURL(waLink(signupMessage())),
  obFinish: () => obFinish(),
  water: a => { const k = dkey(), v = +a.dataset.v; S.habits[k] = S.habits[k] || {}; S.habits[k].water = S.habits[k].water === v ? v - 1 : v; save(); renderShell(); },

  checkin: () => checkinSheet(),
  scale: a => { a.parentNode.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === a)); },
  toggleChip: a => a.classList.toggle('on'),
  sendCheckin: a => { const c = collectCheckin(), t = checkinText(c);
    openURL(a.dataset.v === 'wa' ? waLink(t) : mailLink(`Weekly check-in: ${S.profile.first} ${S.profile.last || ''}`, t));
    closeSheet(); renderShell(); toast('Check-in saved'); },
  book: () => bookSheet(),
  sendBook: () => { const t = document.querySelector('[data-scale="type"] .chip.on')?.dataset.v; if (!t) { toast('Pick what you\'d like to book'); return; }
    const when = $('#bk_when').value.trim();
    openURL(waLink(`Hi Nico, it's ${S.profile.first} ${S.profile.last || ''}. I'd like to book: ${t}.${when ? `\nWhen suits me: ${when}` : ''}`)); closeSheet(); },
  editProfile: () => profileSheet(),
  saveProfile: () => { const p = S.profile, v = id => $('#' + id).value.trim();
    if (!v('p_first')) { toast('First name needed'); return; }
    Object.assign(p, {first: v('p_first'), last: v('p_last'), dob: v('p_dob'), phone: v('p_phone'), email: v('p_email'), heightCm: num(v('p_h')), goalWeight: readBW('p_gw'), injuries: v('p_inj'),
      goals: [...document.querySelectorAll('#p_goals .chip.on')].map(c => c.textContent), days: +(document.querySelector('[data-scale="days"] .chip.on')?.dataset.v || p.days)});
    save(); closeSheet(); renderShell(); toast('Saved'); },
  healthCheck: () => healthSheet(),
  hYN: a => { S.profile._parq[a.dataset.i] = a.dataset.v === '1'; a.parentNode.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === a)); },
  saveHealth: () => { S.profile.parq = S.profile._parq; delete S.profile._parq; S.profile.parqDate = Date.now(); save(); closeSheet(); renderShell(); toast('Health check updated'); },
  unit: a => { S.settings.bw = a.dataset.v; save(); renderShell(); },
  backup: () => backup(),
  restorePick: () => restorePick(),
  wipe: () => ask('Delete all your data from this phone? This can\'t be undone.', 'Delete everything', async () => {
    localStorage.removeItem(KEY); try { await IDB.clear(); } catch (e) {} S = blank(); ob = {step: 0, d: {goals: [], days: 3, exp: '', parq: Array(PARQ.length).fill(null)}}; render(); })
};
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  const f = ACT[a.dataset.act]; if (!f) return;
  if (a.tagName === 'BUTTON' || a.dataset.act) { if (a.tagName !== 'A' && a.tagName !== 'LABEL') e.preventDefault(); }
  f(a, e);
});

/* resume banner for a workout in progress */
const _home = homeView;
homeView = function () {
  const html = _home();
  if (!S.active) return html;
  return html.replace('<div class="wrap">', `<div class="wrap"><div class="banner" style="background:var(--ok)"><span style="font-size:22px">⏱️</span><div class="grow"><b>Workout in progress</b>${esc(S.active.name)}</div><button class="btn sm white" data-act="resume">Resume</button></div>`);
};
ACT.resume = () => openPlayer();

/* ---------- boot ---------- */
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
render();
</script>
</body>
</html>
